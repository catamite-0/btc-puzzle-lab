name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import pathlib,re; t=pathlib.Path('src/btc_puzzle_lab/__init__.py').read_text(); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")
          test "$TAG" = "$PYPROJECT"
          test "$TAG" = "$INIT"
          echo "version=$TAG" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel install
        run: |
          python -m pip install dist/*.whl
          btc-puzzle-lab --version
          btc-puzzle-lab list
          btc-puzzle-lab verify 1
          btc-puzzle-lab host

      - name: Extract release notes
        run: |
          chmod +x scripts/extract-changelog.sh
          scripts/extract-changelog.sh "$version" CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
