name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import pathlib,re; t=pathlib.Path('src/btc_puzzle_lab/__init__.py').read_text(); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")
          test "$TAG" = "$PYPROJECT"
          test "$TAG" = "$INIT"
          echo "version=$TAG" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel install
        run: |
          python -m pip install dist/*.whl
          btc-puzzle-lab --version
          btc-puzzle-lab list
          btc-puzzle-lab verify 1
          btc-puzzle-lab host

      - name: Extract release notes
        run: |
          chmod +x scripts/extract-changelog.sh
          scripts/extract-changelog.sh "$version" CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
