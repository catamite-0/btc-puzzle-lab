name: CI

# Lint and unit tests only — never build or run the external solvers here.
# `engines install` compiles keyhunt/Kangaroo/BitCrack/RCKangaroo, and the engine
# self-check actually searches keyspace; doing either on GitHub-hosted runners is
# cryptocurrency compute under the Acceptable Use Policies. Those steps are
# local-only commands by design. Keep this job to pip + ruff + pytest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Pytest
        run: python -m pytest
